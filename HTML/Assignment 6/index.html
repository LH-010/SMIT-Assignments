<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
    </head>
    <body>
        <h1>Student Registration Form</h1>
        <!-- Name -->
        <p><b>Name:</b>
        <input type="text" placeholder="Enter your name"></p>
        <!-- Email address -->
        <p><b>Email:</b>
        <input type="email" placeholder="Enter your email"></p>
        <!-- Age -->
        <p><b>Age:</b>
        <input type="text" placeholder="Enter password"></p>
        <!-- Date of Birth -->
        <p><b>Date of Birth:</b>
        <input type="date"></p>
        <!-- Gender -->
        <p><b>Gender:</b>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female</p>
        <!-- Course selection -->
        <p>
            <b>Select Course:</b>
            <select>
                <option>Select a Course</option>
                <option>Web Development</option>
                <option>Graphic Design</option>
                <option>Digital Marketing</option>
                <option>Python</option>
            </select>
        </p>
        <!--Phone Number-->
        <p><b>Phone Number: <input type="Text" placeholder="03XXXXXXXXX"></b></p>
        <!--Address box-->
        <p><b>Address</b></p>
        <textarea rows="6"></textarea>
        <!--Hobbies-->
        <p>
            <b>Hobbies</b><br>
            <input type="checkbox"> Coding <br>
            <input type="checkbox"> Reading <br>
            <input type="checkbox"> Sports
        </p>
        <!--Photo-->
        <p>
            <b>Upload photo:</b>
            <button type="submit">Choose File</button> No file chosen
        </p>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
        </body>
</html>
